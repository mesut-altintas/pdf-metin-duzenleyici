<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fd1">
  <title>Bağlantı yok · PDF Metin Düzenleyici</title>
  <link rel="icon" href="/static/simge/simge.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1d2330; }
    .kutu { max-width: 360px; margin: 16px; padding: 28px 24px; background: #fff; border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.12); text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: #5d6575; line-height: 1.5; margin: 0 0 18px; }
    button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #1f5fd1; color: #fff; }
  </style>
</head>
<body>
  <div class="kutu">
    <img src="/static/simge/simge.svg" alt="">
    <h1>İnternet bağlantısı yok</h1>
    <p>PDF'ler sunucuda işlendiği için bu uygulama bağlantı olmadan çalışmaz. Bağlantınız gelince yeniden deneyin.</p>
    <button type="button" onclick="location.reload()">Yeniden dene</button>
  </div>
</body>
</html>
